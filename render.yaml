# Blueprint for the A2A service. Kept in the repo so the deployment is
# reviewable and reproducible rather than living only in dashboard state.
services:
  - type: web
    name: octagon-a2a-production-east
    runtime: docker
    repo: https://github.com/OctagonAI/octagon-a2a-agents
    dockerfilePath: ./Dockerfile
    region: virginia
    plan: starter
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # HOST_URL is intentionally unset. The agent card derives its origin from
      # the incoming request, so it is correct on the Render URL today and on a
      # custom domain the moment DNS points there — no redeploy, and never a
      # window where the card advertises a hostname that does not resolve. Pin
      # it only to force one canonical origin, and only once that host answers.
      - key: OCTAGON_API_URL
        value: https://api.octagonai.co/v1
      - key: LOG_LEVEL
        value: info
      # OCTAGON_API_KEY is deliberately NOT set. This is a multi-tenant
      # deployment: every caller presents their own key as a bearer token and it
      # is forwarded upstream, so usage bills against the caller. Setting a key
      # here would silently spend Octagon's own credits for anyone who calls.
